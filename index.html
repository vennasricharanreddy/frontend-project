<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitWise - Login</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body data-page="login">

    <div class="auth-page">

        <div class="auth-card">

            <h1>SplitWise</h1>
            <p class="subtitle">Manage shared expenses easily</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <p class="admin-info">
                Admin: admin@splitwise.com / admin123
            </p>

        </div>

    </div>

    <script type="module" src="src/app.js"></script>

</body>
</html>
